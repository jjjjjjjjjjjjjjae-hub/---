name: Build Windows EXE
on:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained single-file EXE
        run: dotnet publish LargeFileCleaner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
      - uses: actions/upload-artifact@v4
        with:
          name: LargeFileCleaner-windows-x64
          path: bin/Release/net8.0-windows/win-x64/publish/LargeFileCleaner.exe
          if-no-files-found: error
          retention-days: 14
